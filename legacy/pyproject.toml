[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sre-incident-agent"
version = "0.1.0"
description = "Evidence-backed incident investigation using Google ADK"
requires-python = ">=3.12"
dependencies = [
  "google-adk==2.11.0",
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "prometheus-client==0.26.0",
  "opentelemetry-api==1.42.1",
  "opentelemetry-sdk==1.42.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
incident-agent = "incident_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_agent", "src/demo_app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
