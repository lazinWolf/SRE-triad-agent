# SRE triage overlay for the OpenTelemetry Demo.
# Relative paths resolve from infra/otel-demo (the first compose file's directory).
#
# - Publishes telemetry backends on loopback so the triage agent tools can query them.
# - Gives application containers an explicit CPU baseline, so a limit reduction is a
#   visible configuration change and can be restored by an approved remediation.

x-cpu-baseline: &cpu-baseline
  deploy:
    resources:
      limits:
        cpus: "1.0"

services:
  # The shop is published on loopback port SRE_SHOP_PORT (default 8090) rather than the
  # upstream 8080, which other local tools often hold. Inside the network it stays 8080.
  frontend-proxy:
    ports: !override
      - "127.0.0.1:${SRE_SHOP_PORT:-8090}:${ENVOY_PORT}"
  jaeger:
    ports:
      - "127.0.0.1:16686:16686"
  opensearch:
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms320m -Xmx320m
  ad: *cpu-baseline
  cart: *cpu-baseline
  # Upstream caps these Go services at 20M with GOMEMLIMIT=16MiB, which makes the GC run
  # continuously (~1 CPU each at idle) and gives a pathological "healthy" baseline.
  checkout:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 80M
    environment:
      - GOMEMLIMIT=64MiB
  currency: *cpu-baseline
  email: *cpu-baseline
  frontend: *cpu-baseline
  # Upstream caps payment (Node.js with auto-instrumentation) at 140M. It then lives at 85-90% of the limit and
  # the kernel reclaims its memory all the time: 0.4 CPU of kernel time at idle, requests stalling for seconds.
  payment:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 300M
  product-catalog:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 80M
    environment:
      - GOMEMLIMIT=64MiB
  quote: *cpu-baseline
  recommendation: *cpu-baseline
  shipping: *cpu-baseline

  # Prometheus: our copy of the upstream config (adds rule_files + 15s evaluation) and the SRE
  # recording/alerting rules. The config mount replaces upstream's (same container path).
  prometheus:
    volumes:
      - ../sre/prometheus/prometheus-config.yaml:/etc/prometheus/prometheus-config.yaml
      - ../sre/prometheus/rules.yml:/etc/prometheus/rules.yml
